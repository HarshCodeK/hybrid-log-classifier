name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python scripts/train.py
      - run: PYTHONPATH=.:src pytest
      - run: PYTHONPATH=src python scripts/evaluate.py
      - run: python -m compileall -q src app.py scripts
      - run: git diff --check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hybrid-log-classifier:ci
      - run: |
          docker run -d --name hybrid-log-ci -p 8000:8000 hybrid-log-classifier:ci
          for i in $(seq 1 20); do curl --fail http://127.0.0.1:8000/health && break; sleep 1; done
          curl --fail -X POST http://127.0.0.1:8000/classify             -H 'Content-Type: application/json'             -d '{"text":"failed login user=ci"}'
      - if: always()
        run: docker logs hybrid-log-ci || true
      - if: always()
        run: docker rm -f hybrid-log-ci || true
