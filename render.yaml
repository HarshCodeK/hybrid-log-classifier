services:
  - type: web
    name: hybrid-log-classifier
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && PYTHONPATH=src python scripts/train.py
    startCommand: PYTHONPATH=src uvicorn hybrid_log_classifier.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MODEL_PATH
        value: models/classifier.joblib
      - key: DATABASE_PATH
        value: /tmp/classifications.db
